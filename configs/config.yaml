# ============================================================
# Solar PV Forecasting & Anomaly Detection
# Master Configuration File
# ============================================================

project:
  name: "solar_pv_forecasting"
  version: "1.0.0"
  description: "PV Power Forecasting and Fault Detection System"
  seed: 42

# ─── Data ────────────────────────────────────────────────────
data:
  raw_path: "input/dataset.csv"
  processed_path: "data/processed/processed_data.parquet"
  features_path: "data/features/feature_data.parquet"
  daily_path: "data/processed/daily_features.parquet"
  target_column: "ac_power__315"
  timestamp_column: "measured_on"
  system_id: 4

  # Resampling: aggregate 1-min → 15-min to reduce memory footprint
  # while retaining sub-hourly resolution for pattern capture
  resample_freq: "15min"        # options: "1min","15min","30min","1h"  (pandas >= 2.2)

  # Daylight / active generation filter
  min_irradiance_threshold: 10  # W/m² — exclude night rows from training
  min_power_threshold: 0.0      # kW

# ─── Feature Engineering ────────────────────────────────────
features:
  # Temporal cyclic encodings
  cyclic_features: ["hour", "day_of_year", "month", "weekday"]

  # Lag windows (in resampled periods)
  lag_periods: [1, 2, 4, 8, 16, 32, 48, 96]

  # Rolling statistics windows (in periods)
  rolling_windows: [4, 8, 16, 48, 96]

  # Engineered domain features
  engineer:
    efficiency_ratio: true       # ac_power / poa_irradiance (normalised)
    dc_ac_ratio: true            # dc_power / ac_power
    temp_delta: true             # module_temp - ambient_temp
    performance_ratio: true      # daily energy / (irradiance integral * rated_power)

# ─── Forecasting Model ──────────────────────────────────────
forecasting:
  model_type: "GRU"              # GRU chosen — see JUSTIFICATION in notebook
  sequence_length: 96            # 24 h of 15-min samples  → 96 steps lookback
  forecast_horizon: 96           # 24 h ahead
  batch_size: 64
  epochs: 100
  validation_split: 0.1
  test_size: 0.15                # chronological split (no shuffle)

  # Architecture search space (Keras Tuner)
  tuner:
    max_trials: 20
    executions_per_trial: 1
    directory: "experiments/kt_forecasting"
    project_name: "gru_pv_forecast"
    search_units: [32, 64, 128, 256]
    search_dropout: [0.0, 0.1, 0.2, 0.3]
    search_layers: [1, 2, 3]
    search_lr: [1.0e-4, 5.0e-4, 1.0e-3]

  early_stopping:
    monitor: "val_loss"
    patience: 15
    restore_best_weights: true

  # Saved artefacts
  model_path: "models/forecasting/best_gru_model.keras"
  scaler_path: "models/forecasting/feature_scaler.pkl"

# ─── Anomaly / Fault Detection ──────────────────────────────
anomaly_detection:
  # Daily aggregation
  daily_features:
    - daily_energy_kwh
    - peak_power_kw
    - capacity_factor
    - performance_ratio
    - irradiance_energy_wh_m2
    - power_ramp_std
    - zero_power_ratio
    - efficiency_mean
    - efficiency_std
    - module_temp_mean
    - temp_delta_mean
    - power_factor_mean
    - dc_ac_ratio_mean
    - curve_smoothness

  # Isolation Forest
  isolation_forest:
    n_estimators: 200
    contamination: 0.05
    random_state: 42

  # Autoencoder
  autoencoder:
    encoding_dims: [32, 16, 8]
    epochs: 80
    batch_size: 32
    threshold_percentile: 95
    model_path: "models/anomaly/autoencoder.keras"
    scaler_path: "models/anomaly/anomaly_scaler.pkl"

  # Severity thresholds (anomaly score 0–1)
  severity:
    normal_below: 0.35
    moderate_above: 0.35
    severe_above: 0.65

# ─── Evaluation Metrics ─────────────────────────────────────
evaluation:
  forecasting_metrics: ["MAE", "RMSE", "MAPE", "R2"]
  anomaly_metrics: ["silhouette_score", "davies_bouldin_index"]

# ─── Logging ────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "logs/pipeline.log"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

# ─── MLOps / Experiment Tracking ───────────────────────────
mlops:
  experiment_dir: "experiments"
  model_registry: "models"
  artifact_store: "models"
